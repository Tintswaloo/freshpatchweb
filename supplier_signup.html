<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supplier Signup - Fresh Patch</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0fff4;
      margin: 0;
      padding: 0;
    }

    .signup-container {
      max-width: 500px;
      margin: 60px auto;
      padding: 30px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #2e7d32;
    }
p{
  text-align: center;
  color:#2e7d32
}
    label {
      display: block;
      margin-top: 15px;
      color: #333;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .signup-btn {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16
}

    .signup-btn:hover {
      background-color: #45a049;
    }

    .login-link {
      margin-top: 15px;
      text-align: center;
      display: block;
      color: #2e7d32;
      text-decoration: none;
    }
.tc-btn{
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16
}

   .tc-btn:hover {
      background-color: #45a049;
    }
    .tc-btn:hover {
      text-decoration: underline;
    }
  </style>
  <div id ="header-placeholder">s
  </div>
<body>
 
  <h1 style="text-align: center; margin-bottom: 40px;">BECOME A SUPPLIER TODAY</h1>
  <p>Do you want to sell your farm goods here on our platform? Follow the prompts below, easy as 1,2,3</p>

</head>
<body>
  <div class="signup-container">
    <h2>Supplier Sign Up</h2>
    <form action="supplier_dashboard.html" method="GET">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" required />

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required />

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required />

      <label for="farmname">Farm/Business Name</label>
      <input type="text" id="farmname" name="farmname" required />

      <label for="password">Create Password</label>
      <input type="password" id="password" name="password" required />

      <button type ="submit" class="tc-btn">Supplier Terms & Conditions</button>
      <button type="submit" class="signup-btn">Sign Up</button>
      
    </form>
    <a href="supplier_login.html" class="login-link">Already have an account? Log in</a>
  </div>
</section>
  <div id="footer-placeholder"></div>
<script>
 fetch("header.html")
      .then(res => res.text())
      .then(data => document.getElementById("header-placeholder").innerHTML = data);

    fetch("footer.html")
      .then(res => res.text())
      .then(data => document.getElementById("footer-placeholder").innerHTML = data);
      <!-- Products Button -->
      
      function handleCategoryChange() {
    const category = document.getElementById("product-category").value;
    if (category) {
      // redirect or load content dynamically
      window.location.href = category + ".html";
    }
  }
      function toggleDropdown() {
    document.getElementById("dropdownMenu").classList.toggle("show");
  }

  window.onclick = function(event) {
    if (!event.target.matches('.dropbtn')) {
      var dropdowns = document.getElementsByClassName("dropdown-content");
      for (var i = 0; i < dropdowns.length; i++) {
        var openDropdown = dropdowns[i];
        if (openDropdown.classList.contains('show')) {
          openDropdown.classList.remove('show');
        }
      }
    }
  }
  </script>
</body>
</html>
